name: Neon Migration Branch Check
on:
  pull_request:
    paths:
      - 'src/**'
      - 'migration/neon/**'
      - 'tests/neon-*.test.mjs'
      - 'scripts/check-supabase-backup-files.mjs'
      - 'scripts/check-neon-release-gates.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-cloudflare-homologacao.mjs'
      - 'tsconfig*.json'
      - '.github/workflows/neon-pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install dependencies with Cloudflare npm version
        id: install
        run: |
          npm install --global npm@10.9.9 --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Recover lockfile for review (only on installation failure)
        if: failure() && steps.install.outcome == 'failure'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          echo 'LOCKFILE_PATCH_BEGIN'
          git diff -- package-lock.json
          echo 'LOCKFILE_PATCH_END'
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Typecheck and build (without production credentials)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-public-key
          VITE_NEON_AUTH_URL: https://example.neonauth.neon.tech/auth
          VITE_NEON_DATA_API_URL: https://example.apirest.neon.tech/rest/v1
      - name: Build isolated Neon authentication homologation screen
        run: npm run build
        env:
          VITE_NEON_HOMOLOGACAO_ENABLED: 'true'
          VITE_NEON_AUTH_URL: https://example.neonauth.neon.tech/auth
          VITE_NEON_DATA_API_URL: https://example.apirest.neon.tech/rest/v1
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-public-key
      - name: Cloudflare Pages isolated homologation build
        run: npm run build:cloudflare-homologacao
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: chore/neon-migration-prep-20261115
      - name: Cloudflare Pages isolated operational preview build
        run: npm run build:cloudflare-homologacao
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: feat/neon-operacional-copilot
          CF_PAGES_URL: https://a123bcde.rodizio-portaria-neon-hml.pages.dev
          VITE_NEON_SQL06_ENABLED: 'true'
      - name: Reject unauthorized branch and non-isolated preview
        shell: bash
        run: |
          if CF_PAGES=1 CF_PAGES_BRANCH=main npm run build:cloudflare-homologacao; then
            echo "Unexpected production branch acceptance"; exit 1
          fi
          if CF_PAGES=1 CF_PAGES_BRANCH=feat/neon-operacional-copilot CF_PAGES_URL=https://rodizio-portaria-neon-hml.pages.dev npm run build:cloudflare-homologacao; then
            echo "Unexpected canonical preview acceptance"; exit 1
          fi
          if CF_PAGES=1 CF_PAGES_BRANCH=feat/neon-operacional-copilot CF_PAGES_URL=https://a123bcde.rodizio-portaria.pages.dev npm run build:cloudflare-homologacao; then
            echo "Unexpected production hostname acceptance"; exit 1
          fi
      - name: Validate all Neon contracts and regressions (offline)
        run: node --test tests/neon-*.test.mjs
      - name: ESLint
        run: npm run lint
